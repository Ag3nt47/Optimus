[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimus-computer-optimization-tool"
version = "0.2.0"
description = "Optimus: Computer optimization tool - open-source Windows maintenance and debloat"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Optimus contributors"}]
dependencies = ["PySide6>=6.6,<7", "psutil>=6,<8"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]
test = ["pytest>=8,<10"]

[project.gui-scripts]
optimus = "optimus.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optimus = ["engine/*.ps1", "widgets/*.txt", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
