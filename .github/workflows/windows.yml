name: Native builds
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: Windows-x64
            architecture: x64
          - os: macos-14
            target: macOS-arm64
            architecture: arm64
          - os: macos-15-intel
            target: macOS-x64
            architecture: x64
          - os: ubuntu-22.04
            target: Linux-x86_64
            architecture: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Install Linux desktop runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libx11-xcb1 libfontconfig1
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install -e "." --no-deps
      - name: Native and shared platform regression suites
        run: python tools/test_native.py --junitxml=test-artifacts/pytest.xml
      - name: Critical fixture UI and workflow review
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/critical_review.py --output test-artifacts/critical-review --github-summary
      - name: PowerShell engine fixture tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & tests/Test-FileTools.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/Test-DriverCoverage.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/Test-AutomatedSystem.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/Test-SafeRecycle.ps1 -SkipLive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/Test-Maintenance.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/Test-RegistryTools.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/Test-RegistryIntegration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/Test-InventoryCoverage.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, verify and archive the native application
        run: python tools/build_native.py --expected-target ${{ matrix.target }}
      - name: Package public editable source
        if: runner.os == 'Windows'
        run: python tools/build_native.py --source-only
      - uses: actions/upload-artifact@v4
        with:
          name: Optimus-release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
      - name: Upload test and packaged interface results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Optimus-test-results-${{ matrix.target }}
          path: test-artifacts/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: Optimus-release-*
          merge-multiple: true
          path: release-assets
      - name: Generate cross-platform release checksums
        run: python tools/build_native.py --checksums-only
      - name: Publish individually downloadable native applications
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/publish_release.py --tag "$GITHUB_REF_NAME" --assets release-assets
